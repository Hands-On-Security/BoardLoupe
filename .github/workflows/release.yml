name: Release

# A v* tag creates a release and deploys that same build to GitHub Pages.
# Publishing a v* release in the GitHub UI runs the same pipeline.
on:
  push:
    tags: ['v*']
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run build
      - name: Stage Pages entrypoint
        run: |
          mkdir -p dist/pages
          cp dist/boardloupe.html dist/pages/index.html
          cmp dist/boardloupe.html dist/pages/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages
      - name: Create / update release with the single-file viewer
        uses: softprops/action-gh-release@v2
        with:
          files: dist/boardloupe.html
          generate_release_notes: ${{ github.event_name == 'push' }}
          fail_on_unmatched_files: true

  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy release to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
