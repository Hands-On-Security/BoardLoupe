<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 960" role="img" aria-labelledby="title desc">
  <title id="title">BoardLoupe logo concepts</title>
  <desc id="desc">Six candidate app marks shown at large and toolbar sizes.</desc>
  <defs>
    <symbol id="emoji" viewBox="0 0 80 80">
      <text x="4" y="64" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="66">🔍</text>
    </symbol>
    <symbol id="plain" viewBox="0 0 80 80">
      <circle cx="32" cy="32" r="21" fill="none" stroke="#e8b04a" stroke-width="6"/>
      <path d="M48 48 68 68" fill="none" stroke="#e8b04a" stroke-width="8" stroke-linecap="round"/>
    </symbol>
    <symbol id="pads" viewBox="0 0 80 80">
      <circle cx="32" cy="32" r="22" fill="none" stroke="#e8b04a" stroke-width="5"/>
      <path d="M19 34h11v-9h13" fill="none" stroke="#40e0ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="19" cy="34" r="4" fill="#40e0ff"/>
      <circle cx="43" cy="25" r="4" fill="#40e0ff"/>
      <path d="M49 49 68 68" fill="none" stroke="#e8b04a" stroke-width="8" stroke-linecap="round"/>
    </symbol>
    <symbol id="target" viewBox="0 0 80 80">
      <circle cx="32" cy="32" r="22" fill="none" stroke="#e8b04a" stroke-width="5"/>
      <path d="M32 17v9m0 12v9M17 32h9m12 0h9" fill="none" stroke="#40e0ff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="32" cy="32" r="4.5" fill="#40e0ff"/>
      <path d="M49 49 68 68" fill="none" stroke="#e8b04a" stroke-width="8" stroke-linecap="round"/>
    </symbol>
    <symbol id="board" viewBox="0 0 80 80">
      <rect x="8" y="10" width="49" height="49" rx="7" fill="none" stroke="#8693a4" stroke-width="4"/>
      <circle cx="29" cy="31" r="17" fill="#12161d" stroke="#e8b04a" stroke-width="5"/>
      <path d="M20 36h10v-9h9" fill="none" stroke="#40e0ff" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="20" cy="36" r="3.5" fill="#40e0ff"/>
      <circle cx="39" cy="27" r="3.5" fill="#40e0ff"/>
      <path d="M42 44 67 69" fill="none" stroke="#e8b04a" stroke-width="8" stroke-linecap="round"/>
    </symbol>
    <symbol id="letter" viewBox="0 0 80 80">
      <circle cx="32" cy="32" r="22" fill="none" stroke="#e8b04a" stroke-width="5"/>
      <text x="19" y="43" fill="#e3e8ef" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="32">B</text>
      <path d="M49 49 68 68" fill="none" stroke="#e8b04a" stroke-width="8" stroke-linecap="round"/>
    </symbol>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .card { fill: #12161d; stroke: #2e3644; stroke-width: 1.5; }
      .card.selected { stroke: #e8b04a; stroke-width: 2; }
      .title { fill: #e3e8ef; font-size: 24px; font-weight: 650; }
      .body { fill: #98a3b3; font-size: 17px; }
      .label { fill: #6b7686; font-size: 14px; font-weight: 600; letter-spacing: 1px; }
    </style>
  </defs>
  <rect width="1400" height="960" fill="#0d1117"/>
  <text x="40" y="60" fill="#e3e8ef" font-size="36" font-weight="700">BoardLoupe</text>
  <text x="40" y="96" fill="#98a3b3" font-size="20">Six simple marks · shown at app icon and toolbar sizes · option 3 selected</text>

  <g transform="translate(40 135)">
    <rect class="card" width="410" height="360" rx="18"/>
    <text class="title" x="24" y="42">1 · Unicode loupe</text>
    <rect x="24" y="67" width="124" height="124" rx="20" fill="#1c222c"/>
    <use href="#emoji" xlink:href="#emoji" x="46" y="89" width="80" height="80"/>
    <text class="label" x="180" y="94">32 PX</text>
    <rect x="180" y="108" width="54" height="54" rx="9" fill="#1c222c"/>
    <use href="#emoji" xlink:href="#emoji" x="191" y="119" width="32" height="32"/>
    <text class="label" x="265" y="94">18 PX</text>
    <rect x="265" y="108" width="54" height="54" rx="9" fill="#1c222c"/>
    <use href="#emoji" xlink:href="#emoji" x="283" y="126" width="18" height="18"/>
    <text class="body" x="24" y="238">Just 🔍. Zero drawing, instantly clear.</text>
    <text class="body" x="24" y="268">Appearance changes by operating system.</text>
    <text class="label" x="24" y="325">MOST MINIMAL</text>
  </g>

  <g transform="translate(495 135)">
    <rect class="card" width="410" height="360" rx="18"/>
    <text class="title" x="24" y="42">2 · Plain loupe</text>
    <rect x="24" y="67" width="124" height="124" rx="20" fill="#1c222c"/>
    <use href="#plain" xlink:href="#plain" x="46" y="89" width="80" height="80"/>
    <text class="label" x="180" y="94">32 PX</text>
    <rect x="180" y="108" width="54" height="54" rx="9" fill="#1c222c"/>
    <use href="#plain" xlink:href="#plain" x="191" y="119" width="32" height="32"/>
    <text class="label" x="265" y="94">18 PX</text>
    <rect x="265" y="108" width="54" height="54" rx="9" fill="#1c222c"/>
    <use href="#plain" xlink:href="#plain" x="283" y="126" width="18" height="18"/>
    <text class="body" x="24" y="238">One stroke, one idea.</text>
    <text class="body" x="24" y="268">Consistent everywhere, even at 18 px.</text>
    <text class="label" x="24" y="325">CLEANEST VECTOR</text>
  </g>

  <g transform="translate(950 135)">
    <rect class="card selected" width="410" height="360" rx="18"/>
    <text class="title" x="24" y="42">3 · PCB pads</text>
    <rect x="24" y="67" width="124" height="124" rx="20" fill="#1c222c"/>
    <use href="#pads" xlink:href="#pads" x="46" y="89" width="80" height="80"/>
    <text class="label" x="180" y="94">32 PX</text>
    <rect x="180" y="108" width="54" height="54" rx="9" fill="#1c222c"/>
    <use href="#pads" xlink:href="#pads" x="191" y="119" width="32" height="32"/>
    <text class="label" x="265" y="94">18 PX</text>
    <rect x="265" y="108" width="54" height="54" rx="9" fill="#1c222c"/>
    <use href="#pads" xlink:href="#pads" x="283" y="126" width="18" height="18"/>
    <text class="body" x="24" y="238">A lens inspecting two connected pads.</text>
    <text class="body" x="24" y="268">Hints at nets without clutter.</text>
    <text x="24" y="325" fill="#e8b04a" font-size="14" font-weight="700" letter-spacing="1">SELECTED</text>
  </g>

  <g transform="translate(40 530)">
    <rect class="card" width="410" height="360" rx="18"/>
    <text class="title" x="24" y="42">4 · Probe target</text>
    <rect x="24" y="67" width="124" height="124" rx="20" fill="#1c222c"/>
    <use href="#target" xlink:href="#target" x="46" y="89" width="80" height="80"/>
    <text class="label" x="180" y="94">32 PX</text>
    <rect x="180" y="108" width="54" height="54" rx="9" fill="#1c222c"/>
    <use href="#target" xlink:href="#target" x="191" y="119" width="32" height="32"/>
    <text class="label" x="265" y="94">18 PX</text>
    <rect x="265" y="108" width="54" height="54" rx="9" fill="#1c222c"/>
    <use href="#target" xlink:href="#target" x="283" y="126" width="18" height="18"/>
    <text class="body" x="24" y="238">Lens plus a central test point.</text>
    <text class="body" x="24" y="268">Good fit for finding solder points.</text>
    <text class="label" x="24" y="325">PRECISE</text>
  </g>

  <g transform="translate(495 530)">
    <rect class="card" width="410" height="360" rx="18"/>
    <text class="title" x="24" y="42">5 · Board corner</text>
    <rect x="24" y="67" width="124" height="124" rx="20" fill="#1c222c"/>
    <use href="#board" xlink:href="#board" x="46" y="89" width="80" height="80"/>
    <text class="label" x="180" y="94">32 PX</text>
    <rect x="180" y="108" width="54" height="54" rx="9" fill="#1c222c"/>
    <use href="#board" xlink:href="#board" x="191" y="119" width="32" height="32"/>
    <text class="label" x="265" y="94">18 PX</text>
    <rect x="265" y="108" width="54" height="54" rx="9" fill="#1c222c"/>
    <use href="#board" xlink:href="#board" x="283" y="126" width="18" height="18"/>
    <text class="body" x="24" y="238">Makes the board context explicit.</text>
    <text class="body" x="24" y="268">More detail to carry at small sizes.</text>
    <text class="label" x="24" y="325">MOST DESCRIPTIVE</text>
  </g>

  <g transform="translate(950 530)">
    <rect class="card" width="410" height="360" rx="18"/>
    <text class="title" x="24" y="42">6 · B in the lens</text>
    <rect x="24" y="67" width="124" height="124" rx="20" fill="#1c222c"/>
    <use href="#letter" xlink:href="#letter" x="46" y="89" width="80" height="80"/>
    <text class="label" x="180" y="94">32 PX</text>
    <rect x="180" y="108" width="54" height="54" rx="9" fill="#1c222c"/>
    <use href="#letter" xlink:href="#letter" x="191" y="119" width="32" height="32"/>
    <text class="label" x="265" y="94">18 PX</text>
    <rect x="265" y="108" width="54" height="54" rx="9" fill="#1c222c"/>
    <use href="#letter" xlink:href="#letter" x="283" y="126" width="18" height="18"/>
    <text class="body" x="24" y="238">A light touch of brand identity.</text>
    <text class="body" x="24" y="268">Best alongside the name.</text>
    <text class="label" x="24" y="325">WORDMARK FRIENDLY</text>
  </g>
</svg>
